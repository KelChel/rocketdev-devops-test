name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_PROJECT_NAME: rocketdev-ci
  MARIADB_DATABASE: wordpress
  MARIADB_USER: wordpress
  MARIADB_PASSWORD: ci_mariadb_password_1234567890
  MARIADB_ROOT_PASSWORD: ci_root_password_12345678901234
  GRAFANA_ADMIN_USER: admin
  GRAFANA_ADMIN_PASSWORD: ci_grafana_password_1234567890
  WP_ADMIN_ALLOWED_CIDR: 127.0.0.1/32

jobs:
  validate:
    name: Validate configuration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24.x'
          cache: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install pinned Jsonnet tools
        run: make install

      - name: Validate generated Grafana dashboards
        run: make check

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Validate shell scripts
        run: bash -n scripts/*.sh

      - name: Install pinned Ansible dependencies
        working-directory: ansible
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          ansible-galaxy collection install \
            -r requirements.yml \
            -p .collections

      - name: Validate Ansible playbook syntax
        working-directory: ansible
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
        run: ansible-playbook -i inventory/hosts.example.yml site.yml --syntax-check

  integration:
    name: Start stack and run smoke tests
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Generate test TLS certificate
        run: bash scripts/generate-self-signed-cert.sh

      - name: Validate Prometheus configuration
        run: |
          docker compose run \
            --rm \
            --no-deps \
            --entrypoint /bin/promtool \
            prometheus \
            check config /etc/prometheus/prometheus.yml

      - name: Pull container images
        run: docker compose pull

      - name: Start Compose stack
        run: docker compose up -d --wait --wait-timeout 300

      - name: Verify expected services
        run: |
          expected_services="$(printf '%s\n' \
            db \
            grafana \
            nginx \
            node-exporter \
            prometheus \
            wordpress | sort)"
          running_services="$(docker compose ps \
            --services \
            --filter status=running | sort)"

          printf 'Expected services:\n%s\n' "$expected_services"
          printf 'Running services:\n%s\n' "$running_services"
          test "$running_services" = "$expected_services"

      - name: Verify Nginx routes
        run: |
          test "$(curl \
            --fail \
            --silent \
            --show-error \
            -H 'Host: unknown.local' \
            http://127.0.0.1/healthz)" = "ok"

          curl \
            --fail \
            --silent \
            --show-error \
            --head \
            -H 'Host: site.local' \
            http://127.0.0.1/

          curl \
            --fail \
            --silent \
            --show-error \
            --head \
            --insecure \
            --resolve site.local:443:127.0.0.1 \
            https://site.local/

          curl \
            --fail \
            --silent \
            --show-error \
            --head \
            -H 'Host: metrics.local' \
            http://127.0.0.1/

      - name: Verify Prometheus targets
        run: |
          for attempt in $(seq 1 12); do
            query_output="$(docker compose exec -T prometheus \
              /bin/promtool query instant \
              http://127.0.0.1:9090 \
              up)"

            if grep -q 'job="prometheus".*=> 1' <<<"$query_output" && \
               grep -q 'job="node".*=> 1' <<<"$query_output"; then
              printf '%s\n' "$query_output"
              exit 0
            fi

            sleep 5
          done

          printf '%s\n' "$query_output"
          exit 1

      - name: Verify provisioned Grafana dashboard
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --user "${GRAFANA_ADMIN_USER}:${GRAFANA_ADMIN_PASSWORD}" \
            -H 'Host: metrics.local' \
            http://127.0.0.1/api/dashboards/uid/os-general |
          python3 -c '
          import json
          import sys

          payload = json.load(sys.stdin)
          dashboard = payload["dashboard"]
          assert dashboard["uid"] == "os-general"
          assert len(dashboard["panels"]) == 6
          print("Validated dashboard:", dashboard["title"])
          '

      - name: Show Compose diagnostics
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Remove test stack
        if: always()
        run: docker compose down --volumes --remove-orphans
