---
- name: Install Fail2ban and nftables
  ansible.builtin.apt:
    name:
      - fail2ban
      - nftables
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install project Fail2ban policy
  ansible.builtin.copy:
    src: "{{ rocketdev_project_dir }}/fail2ban/jail.local"
    dest: /etc/fail2ban/jail.local
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  notify: Restart Fail2ban

- name: Validate Fail2ban configuration
  ansible.builtin.command:
    cmd: fail2ban-client -t
  changed_when: false
  check_mode: false

- name: Enable and start Fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true

- name: Apply pending Fail2ban restart
  ansible.builtin.meta: flush_handlers

- name: Wait for Fail2ban socket
  ansible.builtin.wait_for:
    path: /run/fail2ban/fail2ban.sock
    state: present
    timeout: 20
  check_mode: false

- name: Verify Fail2ban server
  ansible.builtin.command:
    cmd: fail2ban-client ping
  register: fail2ban_ping
  changed_when: false
  check_mode: false
  retries: 5
  delay: 1
  until: '"pong" in fail2ban_ping.stdout'

- name: Verify sshd jail
  ansible.builtin.command:
    cmd: fail2ban-client status sshd
  register: fail2ban_sshd_status
  changed_when: false
  check_mode: false
  failed_when: '"Status for the jail: sshd" not in fail2ban_sshd_status.stdout'

- name: Verify nftables action
  ansible.builtin.command:
    cmd: fail2ban-client get sshd actions
  register: fail2ban_actions
  changed_when: false
  check_mode: false
  failed_when: '"nftables" not in fail2ban_actions.stdout'
