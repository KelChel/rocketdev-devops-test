---
- name: Deploy RocketDev stack
  hosts: rocketdev
  become: true
  gather_facts: true

  pre_tasks:
    - name: Verify supported operating system
      ansible.builtin.assert:
        that:
          - ansible_facts["os_family"] == "Debian"
          - ansible_facts["distribution"] in ["Debian", "Ubuntu"]
        fail_msg: This playbook supports Debian and Ubuntu only.
      tags:
        - always

    - name: Verify deployment secrets
      ansible.builtin.assert:
        that:
          - vault_mariadb_password is defined
          - (vault_mariadb_password | default("")) is match("^[A-Za-z0-9_-]{24,}$")
          - vault_mariadb_root_password is defined
          - (vault_mariadb_root_password | default("")) is match("^[A-Za-z0-9_-]{24,}$")
          - vault_grafana_admin_password is defined
          - (vault_grafana_admin_password | default("")) is match("^[A-Za-z0-9_-]{24,}$")
          - vault_wp_admin_allowed_cidr is defined
          - (vault_wp_admin_allowed_cidr | default("")) is match("^[0-9A-Fa-f:./]+/[0-9]{1,3}$")
        fail_msg: Define valid deployment values in encrypted vault.yml.
      no_log: true
      tags:
        - always

  roles:
    - role: docker
      tags:
        - docker

    - role: application
      tags:
        - application

    - role: fail2ban
      tags:
        - security
